[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "spde-covariance"
version = "0.3.0"
description = "Transport-SPDE innovation covariance with PSD constraints and observability diagnostics"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["numpy>=2.2", "scipy>=1.15", "matplotlib>=3.10"]

[project.optional-dependencies]
reference = ["cvxpy>=1.7", "scs>=3.2.7"]
notebooks = ["jupyterlab>=4.4", "ipykernel>=6.29"]
empirical = ["python-calamine>=0.3"]

[project.urls]
Repository = "https://github.com/xrough/spde-covariance"
Issues = "https://github.com/xrough/spde-covariance/issues"
Documentation = "https://github.com/xrough/spde-covariance/blob/main/docs/api.md"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.11"]

[project.scripts]
spde-covariance = "spde_covariance.experiments:main"

[tool.hatch.build.targets.wheel]
packages = ["src/spde_covariance"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

