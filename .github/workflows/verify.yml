name: Verify transport covariance toolkit
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  numerics:
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.5"
          enable-cache: true
      - run: uv sync --locked --extra reference --extra empirical
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync pytest
      - run: uv run --no-sync python scripts/check_empirical_research.py
      - run: uv run --no-sync python scripts/check_short_history.py
      - run: uv run --no-sync python scripts/check_mechanisms.py
      - run: uv run --no-sync python examples/transport_pipeline.py
      - run: uv run --no-sync python examples/canonical_pipeline.py
      - run: uv run --no-sync python examples/coherent_pipeline.py
      - run: uv run --no-sync python examples/futures_pipeline.py
      - run: uv run --no-sync python examples/empirical_pipeline.py
      - run: uv run --no-sync python examples/empirical_research_pipeline.py
      - run: uv run --no-sync python examples/short_history_pipeline.py
      - run: uv run --no-sync python examples/mechanism_pipeline.py --output experiments/runs/ci-mechanisms
      - run: uv run --no-sync python examples/mechanism_oracle.py --smoke --output experiments/runs/ci-mechanism-oracle.json
      - run: uv run --no-sync python examples/statistical_completion.py
      - run: uv run --no-sync python scripts/check_notebook.py
      - run: uv run --no-sync python scripts/check_notebook.py notebooks/current_findings.ipynb
      - run: uv run --no-sync python scripts/check_notebook.py notebooks/shfe_empirical.ipynb
      - name: Execute all empirical research notebooks from aggregate evidence
        shell: bash
        run: |
          for notebook in notebooks/0*.ipynb; do
            uv run --no-sync python scripts/check_notebook.py "$notebook"
          done
      - run: uv run --no-sync spde-covariance benchmark experiments/configs/stage1-smoke.toml --output experiments/runs/ci-stage1
      - run: uv run --no-sync spde-covariance benchmark-rq2 experiments/configs/rq2-smoke.toml --output experiments/runs/ci-rq2
      - run: uv run --no-sync spde-covariance benchmark-rq3 experiments/configs/rq3-smoke.toml --output experiments/runs/ci-rq3
      - run: uv run --no-sync spde-covariance benchmark-infinite-transport experiments/configs/infinite-transport-smoke.toml --output experiments/runs/ci-infinite-transport
      - run: uv run --no-sync spde-covariance benchmark-partial experiments/configs/partial-observations-smoke.toml --output experiments/runs/ci-partial
      - run: uv run --no-sync spde-covariance benchmark-partial experiments/configs/canonical-smoke.toml --output experiments/runs/ci-canonical
      - run: uv run --no-sync spde-covariance benchmark-partial experiments/configs/coherent-smoke.toml --output experiments/runs/ci-coherent
      - run: uv run --no-sync spde-covariance benchmark-partial experiments/configs/completion-research-smoke.toml --output experiments/runs/ci-completion-research
      - run: uv run --no-sync spde-covariance benchmark-rq3 experiments/configs/completion-forecast-smoke.toml --output experiments/runs/ci-completion-forecast
      - run: uv run --no-sync spde-covariance benchmark-hedging experiments/configs/identified-hedging-smoke.toml --output experiments/runs/ci-identified-hedging
      - run: uv run --no-sync spde-covariance benchmark-statistical-completion experiments/configs/statistical-completion-smoke.toml --output experiments/runs/ci-statistical-completion
      - name: Show numerical diagnostics after a failed smoke study
        if: failure()
        shell: bash
        run: |
          uv run --no-sync python - <<'PY'
          import json
          from pathlib import Path
          for path in sorted(Path("experiments/runs").glob("ci-*/results.json")):
              results = json.loads(path.read_text())
              print(path, json.dumps({
                  "acceptance": results.get("acceptance"),
                  "reference_checks": results.get("reference_checks"),
              }, indent=2))
          PY
      - name: Verify a clean wheel installation outside the checkout
        shell: bash
        run: |
          uv build --wheel
          uv venv "$RUNNER_TEMP/spde-clean"
          uv pip install --python "$RUNNER_TEMP/spde-clean/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/spde-clean/bin/python" "$GITHUB_WORKSPACE/examples/transport_pipeline.py"
          "$RUNNER_TEMP/spde-clean/bin/python" "$GITHUB_WORKSPACE/examples/canonical_pipeline.py"
          "$RUNNER_TEMP/spde-clean/bin/python" "$GITHUB_WORKSPACE/examples/coherent_pipeline.py"
          "$RUNNER_TEMP/spde-clean/bin/python" "$GITHUB_WORKSPACE/examples/futures_pipeline.py"
          "$RUNNER_TEMP/spde-clean/bin/python" "$GITHUB_WORKSPACE/examples/empirical_pipeline.py"
          "$RUNNER_TEMP/spde-clean/bin/python" "$GITHUB_WORKSPACE/examples/empirical_research_pipeline.py"
          "$RUNNER_TEMP/spde-clean/bin/python" "$GITHUB_WORKSPACE/examples/short_history_pipeline.py"
          "$RUNNER_TEMP/spde-clean/bin/python" "$GITHUB_WORKSPACE/examples/mechanism_pipeline.py"
          "$RUNNER_TEMP/spde-clean/bin/python" "$GITHUB_WORKSPACE/examples/mechanism_oracle.py" --smoke --output "$RUNNER_TEMP/ci-mechanism-oracle.json"
          "$RUNNER_TEMP/spde-clean/bin/python" "$GITHUB_WORKSPACE/examples/statistical_completion.py"
          "$RUNNER_TEMP/spde-clean/bin/python" "$GITHUB_WORKSPACE/scripts/check_notebook.py"
          "$RUNNER_TEMP/spde-clean/bin/python" "$GITHUB_WORKSPACE/scripts/check_notebook.py" "$GITHUB_WORKSPACE/notebooks/current_findings.ipynb"
          "$RUNNER_TEMP/spde-clean/bin/python" "$GITHUB_WORKSPACE/scripts/check_notebook.py" "$GITHUB_WORKSPACE/notebooks/shfe_empirical.ipynb"
          for notebook in "$GITHUB_WORKSPACE"/notebooks/0*.ipynb; do
            "$RUNNER_TEMP/spde-clean/bin/python" "$GITHUB_WORKSPACE/scripts/check_notebook.py" "$notebook"
          done
          "$RUNNER_TEMP/spde-clean/bin/spde-covariance" --help
          "$RUNNER_TEMP/spde-clean/bin/spde-covariance" empirical-research --help
          "$RUNNER_TEMP/spde-clean/bin/spde-covariance" benchmark-short-history --help
          "$RUNNER_TEMP/spde-clean/bin/spde-covariance" benchmark-mechanisms --help
          "$RUNNER_TEMP/spde-clean/bin/spde-covariance" benchmark-rq3 --help
          "$RUNNER_TEMP/spde-clean/bin/spde-covariance" benchmark-infinite-transport --help
          "$RUNNER_TEMP/spde-clean/bin/spde-covariance" benchmark-partial --help
          "$RUNNER_TEMP/spde-clean/bin/spde-covariance" benchmark-hedging --help
          "$RUNNER_TEMP/spde-clean/bin/spde-covariance" benchmark-statistical-completion --help
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: smoke-${{ matrix.os }}
          path: |
            experiments/runs/ci-stage1
            experiments/runs/ci-rq2
            experiments/runs/ci-rq3
            experiments/runs/ci-infinite-transport
            experiments/runs/ci-partial
            experiments/runs/ci-canonical
            experiments/runs/ci-coherent
            experiments/runs/ci-completion-research
            experiments/runs/ci-completion-forecast
            experiments/runs/ci-identified-hedging
            experiments/runs/ci-statistical-completion
