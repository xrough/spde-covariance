name: Pinned author completion reference

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  explicit-rank-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.5"
          enable-cache: true
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
      - run: uv sync --locked
      - run: uv run --no-sync python scripts/export_completion_reference.py experiments/runs/author-reference
      - run: Rscript scripts/check_author_completion.R experiments/runs/author-reference
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: pinned-author-explicit-rank-parity
          path: experiments/runs/author-reference
